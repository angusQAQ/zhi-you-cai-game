name: Check and deploy two island games
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: github-pages
  cancel-in-progress: false
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: npm run check
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python scripts/check_assets.py
      - name: Install audio test tools
        run: sudo apt-get update && sudo apt-get install --yes --no-install-recommends ffmpeg
      - run: pip install playwright==1.62.0
      - run: python -m playwright install --with-deps chromium
      - name: Browser operations at both whiteboard sizes
        run: |
          python -m http.server 8793 --bind 127.0.0.1 --directory dist > /tmp/zyc-server.log 2>&1 &
          for attempt in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:8793/content.json > /dev/null; then break; fi
            sleep 1
          done
          python tests/browser.py
          python tests/audio_browser.py
          python tests/production_audio.py
      - name: Verify production release assets
        run: npm run check:release
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: browser-evidence
          path: evidence/
  deploy:
    if: github.event_name != 'pull_request'
    needs: check
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
      - id: deployment
        uses: actions/deploy-pages@v4
